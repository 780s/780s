<svg width="800" height="160" viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg">

  <rect width="800" height="160" fill="#0d1117"/>

  <!-- "7" -->
  <text x="268" y="112"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="108" font-weight="900" letter-spacing="-2"
    fill="white" opacity="0">
    <animate attributeName="opacity" values="0;1"    dur="0.3s" begin="0.0s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="y"       values="124;112" dur="0.3s" begin="0.0s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    7
  </text>

  <!-- "8" -->
  <text x="368" y="112"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="108" font-weight="900" letter-spacing="-2"
    fill="white" opacity="0">
    <animate attributeName="opacity" values="0;1"    dur="0.3s" begin="0.12s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="y"       values="124;112" dur="0.3s" begin="0.12s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    8
  </text>

  <!-- "0" -->
  <text x="468" y="112"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="108" font-weight="900" letter-spacing="-2"
    fill="white" opacity="0">
    <animate attributeName="opacity" values="0;1"    dur="0.3s" begin="0.24s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="y"       values="124;112" dur="0.3s" begin="0.24s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    0
  </text>

  <!-- Underline draws itself after digits settle -->
  <line x1="268" y1="126" x2="268" y2="126" stroke="white" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;1"   dur="0.1s"  begin="0.5s" fill="freeze"/>
    <animate attributeName="x2"      values="268;568" dur="0.5s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </line>

</svg>
