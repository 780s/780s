<svg width="800" height="140" viewBox="0 0 800 140" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="140" fill="#0d1117"/>

  <!-- Letter: 7 -->
  <text x="258" y="90" text-anchor="middle"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="78" font-weight="900"
    fill="#ff6b6b" filter="url(#shadow)">7
    <animate attributeName="y" values="90;74;90;96;90" dur="1.6s" begin="0s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="font-size" values="78;82;78;76;78" dur="1.6s" begin="0s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </text>

  <!-- Letter: 8 -->
  <text x="330" y="90" text-anchor="middle"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="78" font-weight="900"
    fill="#ffd93d" filter="url(#shadow)">8
    <animate attributeName="y" values="90;74;90;96;90" dur="1.6s" begin="0.2s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="font-size" values="78;82;78;76;78" dur="1.6s" begin="0.2s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </text>

  <!-- Letter: 0 -->
  <text x="404" y="90" text-anchor="middle"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="78" font-weight="900"
    fill="#6bcb77" filter="url(#shadow)">0
    <animate attributeName="y" values="90;74;90;96;90" dur="1.6s" begin="0.4s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="font-size" values="78;82;78;76;78" dur="1.6s" begin="0.4s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </text>

  <!-- Letter: s -->
  <text x="466" y="90" text-anchor="middle"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="78" font-weight="900"
    fill="#4d96ff" filter="url(#shadow)">s
    <animate attributeName="y" values="90;74;90;96;90" dur="1.6s" begin="0.6s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
    <animate attributeName="font-size" values="78;82;78;76;78" dur="1.6s" begin="0.6s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </text>

</svg>
