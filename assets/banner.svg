<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>

    <!-- Animated shimmer gradient for text -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1">
        <animate attributeName="offset" values="-1;1" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="40%" style="stop-color:#ffffff;stop-opacity:1">
        <animate attributeName="offset" values="-0.5;1.5" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="80%" style="stop-color:#58a6ff;stop-opacity:1">
        <animate attributeName="offset" values="0;2" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft glow for lines -->
    <filter id="lineGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="bounds">
      <rect width="800" height="200" rx="12" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bgGrad)" />

  <!-- Animated grid lines horizontal -->
  <g opacity="0.06" clip-path="url(#bounds)">
    <line x1="0" y1="40" x2="800" y2="40" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="800" y2="80" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="800" y2="160" stroke="#58a6ff" stroke-width="0.5"/>
    <!-- Vertical -->
    <line x1="160" y1="0" x2="160" y2="200" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="200" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="200" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="640" y2="200" stroke="#58a6ff" stroke-width="0.5"/>
  </g>

  <!-- Moving scan line -->
  <rect x="0" y="0" width="800" height="3" fill="#58a6ff" opacity="0.12" clip-path="url(#bounds)">
    <animate attributeName="y" values="-4;204;-4" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.18;0" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Animated accent line left -->
  <line x1="60" y1="60" x2="60" y2="140" stroke="#58a6ff" stroke-width="1.5" opacity="0" filter="url(#lineGlow)">
    <animate attributeName="opacity" values="0;0.9;0" dur="3s" begin="0.5s" repeatCount="indefinite" />
    <animate attributeName="y1" values="80;60;80" dur="3s" begin="0.5s" repeatCount="indefinite" />
    <animate attributeName="y2" values="120;140;120" dur="3s" begin="0.5s" repeatCount="indefinite" />
  </line>

  <!-- Animated accent line right -->
  <line x1="740" y1="60" x2="740" y2="140" stroke="#58a6ff" stroke-width="1.5" opacity="0" filter="url(#lineGlow)">
    <animate attributeName="opacity" values="0;0.9;0" dur="3s" begin="1.5s" repeatCount="indefinite" />
    <animate attributeName="y1" values="80;60;80" dur="3s" begin="1.5s" repeatCount="indefinite" />
    <animate attributeName="y2" values="120;140;120" dur="3s" begin="1.5s" repeatCount="indefinite" />
  </line>

  <!-- Pulsing dot top-left -->
  <circle cx="60" cy="60" r="3" fill="#58a6ff" opacity="0.5">
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Pulsing dot bottom-left -->
  <circle cx="60" cy="140" r="3" fill="#58a6ff" opacity="0.5">
    <animate attributeName="r" values="2;4;2" dur="2s" begin="0.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="0.5s" repeatCount="indefinite" />
  </circle>

  <!-- Pulsing dot top-right -->
  <circle cx="740" cy="60" r="3" fill="#58a6ff" opacity="0.5">
    <animate attributeName="r" values="2;4;2" dur="2s" begin="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="1s" repeatCount="indefinite" />
  </circle>

  <!-- Pulsing dot bottom-right -->
  <circle cx="740" cy="140" r="3" fill="#58a6ff" opacity="0.5">
    <animate attributeName="r" values="2;4;2" dur="2s" begin="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Main "780" text shadow/glow layer -->
  <text x="400" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="88" font-weight="700"
        fill="#58a6ff" opacity="0.15" filter="url(#glow)">780</text>

  <!-- Main "780" text with shimmer -->
  <text x="400" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="88" font-weight="700"
        fill="url(#shimmer)" filter="url(#glow)">780</text>

  <!-- Subtitle fade in -->
  <text x="400" y="155" text-anchor="middle" font-family="'Courier New', monospace" font-size="12"
        letter-spacing="6" fill="#8b949e" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0.7" dur="2s" begin="0.5s" fill="freeze" />
    BUILDING · ALWAYS LEARNING
  </text>

  <!-- Subtle border -->
  <rect x="1" y="1" width="798" height="198" rx="12" fill="none" stroke="#30363d" stroke-width="1" />
</svg>
